<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineCLT</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{--orange:#8b5cf6;--orange-hi:#a78bfa;--bg:#0b0d12;--card:#1d2028;--text:#f2f3f5;--sub:#b8bdc9;--line:rgba(255,255,255,.08);}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',Roboto,Arial,sans-serif;color:var(--text);}
  #stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;will-change:transform;background:radial-gradient(1200px 700px at 50% -10%,#1a1d26 0%,#0b0d12 70%);overflow:hidden;}
  .screen{position:absolute;inset:0;display:none;}
  .screen.active{display:block;}
  .focusable{outline:none;transition:border-color .05s;backface-visibility:hidden;}
  .focusable:focus{border-color:var(--orange)!important;outline:2px solid var(--orange);outline-offset:1px;transform:none;box-shadow:none;}
  .logo-box{width:52px;height:52px;border-radius:13px;background:linear-gradient(135deg,#a78bfa,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#fff;box-shadow:0 6px 18px rgba(139,92,246,.45);}
  .brand-text{font-size:34px;font-weight:800;letter-spacing:.5px;color:#fff;}
  .brand-text span{color:var(--orange);}
  #screenProfiles{background:linear-gradient(180deg,#0c0e13,#08090d);}
  #screenProfiles .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:16px;}
  .head-sub{color:var(--sub);font-size:22px;text-align:center;letter-spacing:.5px;}
  .brand-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;}
  /* Splash */
  #splash{position:absolute;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(1100px 640px at 50% 22%,#1c1f2a,#0b0d12 76%);transition:opacity .5s;}
  #splash.hide{opacity:0;pointer-events:none;}
  .splash-logo-wrap{position:relative;width:118px;height:118px;}
  .splash-glow{position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;border:3px solid rgba(139,92,246,.65);animation:glow 1.6s ease-out infinite;}
  .splash-logo{position:relative;width:118px;height:118px;border-radius:30px;background:linear-gradient(135deg,#a78bfa,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:800;color:#fff;box-shadow:0 0 70px rgba(139,92,246,.65);animation:logoIn 1.1s cubic-bezier(.2,.9,.3,1.15) forwards;}
  .splash-brand{font-size:86px;font-weight:900;letter-spacing:2px;color:#fff;margin-top:26px;opacity:0;animation:fadeUp .8s .25s ease forwards;}
  .splash-brand span{color:var(--orange);text-shadow:0 0 34px rgba(139,92,246,.7);}
  .splash-tag{font-size:22px;color:#b9bfcb;margin-top:8px;letter-spacing:6px;text-transform:uppercase;opacity:0;animation:fadeUp .8s .45s ease forwards;}
  .splash-bar{width:280px;height:7px;border-radius:7px;background:#2a2e3a;margin-top:42px;overflow:hidden;opacity:0;animation:fadeUp .6s .6s ease forwards;}
  .splash-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a78bfa,#7c3aed);border-radius:7px;animation:load 1.2s ease forwards;}
  @keyframes logoIn{0%{transform:scale(.2) rotate(-45deg);opacity:0;}55%{transform:scale(1.15) rotate(10deg);opacity:1;}75%{transform:scale(.95) rotate(-3deg);}100%{transform:scale(1) rotate(0);opacity:1;}}
  @keyframes glow{0%{transform:scale(.6);opacity:.9;}100%{transform:scale(1.4);opacity:0;}}
  @keyframes fadeUp{0%{transform:translateY(22px);opacity:0;}100%{transform:translateY(0);opacity:1;}}
  @keyframes load{to{width:100%;}}
  .profile-grid{display:flex;flex-wrap:wrap;gap:30px 40px;justify-content:center;max-width:1120px;}
  .profile-tile{width:200px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;cursor:pointer;padding-top:4px;}
  .profile-avatar{width:184px;height:184px;border-radius:50%;background-size:cover;background-position:center;border:5px solid transparent;flex:0 0 auto;background-color:#1d2128;}
  .profile-name{width:100%;margin-top:20px;font-size:25px;font-weight:700;color:#e9eaee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .profile-hint{margin-top:8px;font-size:16px;color:var(--sub);letter-spacing:.3px;}
  .add-tile .profile-avatar{display:flex;align-items:center;justify-content:center;font-size:66px;color:var(--sub);background:rgba(255,255,255,.07);}
  .manage-bar{display:flex;gap:18px;margin-top:8px;}
  .btn{display:flex;align-items:center;gap:12px;padding:16px 34px;border-radius:10px;background:var(--card);border:3px solid transparent;font-size:21px;font-weight:700;color:#fff;cursor:pointer;user-select:none;}
  .btn.primary{background:var(--orange);}
  .btn.ghost{background:rgba(255,255,255,.10);}
  .btn.danger{background:#d0342c;}
  #screenHome{background:var(--bg);}
  .nav{position:absolute;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:20px 44px;background:linear-gradient(180deg,rgba(0,0,0,.72),transparent);}
  .nav-left{display:flex;align-items:center;gap:40px;}
  .nav-links{display:flex;gap:8px;align-items:center;}
  .nav-link{padding:8px 16px;font-size:19px;font-weight:600;color:#eef0f5;border-radius:6px;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.8);}
  .nav-link.active{color:var(--orange);font-weight:800;}
  .nav-profile{display:flex;align-items:center;gap:14px;cursor:pointer;padding:6px 10px;border-radius:34px;border:3px solid transparent;}
  .nav-profile .avatar{width:84px;height:84px;border-radius:50%;background-size:cover;background-position:center;border:3px solid var(--orange);}
  #navProfileName{font-size:32px;font-weight:800;letter-spacing:.5px;}
  .hero{position:relative;width:100%;height:420px;}
  .hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 18%;}
  .hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,13,18,.98) 0%,rgba(11,13,18,.55) 45%,rgba(11,13,18,.1) 72%),linear-gradient(0deg,#0b0d12 0%,transparent 42%);}
  .hero-content{position:relative;z-index:5;display:flex;flex-direction:column;justify-content:flex-end;height:100%;padding:0 60px 34px;}
  .hero-title{font-size:66px;font-weight:900;line-height:1.02;max-width:640px;text-shadow:0 4px 24px rgba(0,0,0,.7);}
  .hero-meta{display:flex;align-items:center;gap:16px;margin:16px 0 24px;color:#eef1f7;font-size:20px;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.85);}
  .hero-actions{display:flex;gap:20px;}
  .content-rows{position:absolute;top:420px;left:0;right:0;bottom:0;overflow:hidden;padding:22px 0 0;}
  .row{margin-bottom:34px;content-visibility:auto;contain-intrinsic-size:auto 420px;}
  .row-title{font-size:26px;font-weight:800;padding:0 44px;margin-bottom:10px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);}
  .row-track{display:flex;gap:6px;padding:6px 44px;overflow-x:hidden;}
  .card{flex:0 0 auto;width:176px;height:264px;cursor:pointer;border-radius:12px;overflow:hidden;position:relative;border:3px solid transparent;background:#111;}
  .card img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;background:#111;}
  .card-title{position:absolute;left:0;right:0;bottom:0;padding:30px 10px 8px;background:linear-gradient(0deg,rgba(0,0,0,.95),transparent);font-size:16px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.95);}
  .empty-hint{text-align:center;padding:70px 0;color:#9aa0ad;font-size:23px;}
  .modal-layer{position:absolute;inset:0;z-index:80;display:none;background:rgba(0,0,0,.82);}
  .modal-layer.active{display:flex;align-items:center;justify-content:center;}
  .modal{width:660px;background:#16181f;border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 30px 70px rgba(0,0,0,.7);}
  .modal h2{font-size:30px;margin-bottom:6px;}
  .modal .desc{color:var(--sub);font-size:18px;margin-bottom:22px;}
  .field{margin-bottom:20px;}
  .field label{display:block;font-size:14px;color:var(--sub);margin-bottom:8px;text-transform:uppercase;letter-spacing:.6px;}
  .name-input{width:100%;padding:15px 18px;font-size:22px;border-radius:10px;background:#0f1116;color:#fff;border:3px solid transparent;outline:none;}
  .name-input:focus{border-color:var(--orange);}
  .icon-picker{display:flex;flex-wrap:wrap;gap:12px;max-height:230px;overflow-y:auto;padding:4px;}
  .icon-opt{width:92px;height:92px;border-radius:50%;background-size:cover;background-position:center;cursor:pointer;border:5px solid transparent;flex:0 0 auto;background-color:#222;content-visibility:auto;contain-intrinsic-size:92px 92px;}
  .icon-opt.selected{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,106,0,.4);}
  .modal-actions{display:flex;justify-content:flex-end;gap:16px;margin-top:24px;}
  .modal-actions .spacer{margin-right:auto;}
  .toast{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);background:var(--orange);color:#fff;padding:13px 26px;border-radius:30px;font-size:18px;font-weight:600;z-index:120;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5);}
  .toast.show{opacity:1;}
  #versionTag{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:17px;font-weight:800;color:#ffd54a;z-index:60;letter-spacing:1px;text-shadow:0 1px 3px rgba(0,0,0,.9);pointer-events:none;background:rgba(0,0,0,.55);padding:6px 16px;border-radius:9px;}
  .detail-flex{display:flex;gap:28px;align-items:flex-start;}
  .detail-media{width:360px;height:540px;flex:0 0 auto;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 14px 40px rgba(0,0,0,.55);}
  .detail-media img{width:100%;height:100%;object-fit:contain;display:block;background:#0d0f14;}
  .detail-info{flex:1;min-width:0;}
  .detail-title{font-size:36px;line-height:1.15;margin-bottom:8px;}
  .detail-meta{font-size:18px;color:var(--sub);margin-bottom:14px;}
  .detail-desc{font-size:17px;color:#cfd3dc;line-height:1.55;margin-bottom:20px;max-height:235px;overflow-y:auto;}
  .player-box{width:1060px;max-width:94vw;display:flex;flex-direction:column;align-items:flex-end;}
  .player-row{display:flex;gap:16px;align-items:center;margin-top:20px;width:100%;justify-content:flex-end;}
  .player-frame{width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;}
  .player-frame iframe,.player-frame video{width:100%;height:100%;border:0;background:#000;}
</style>
</head>
<body>
<div id="stage">
  <!-- SPLASH -->
  <div id="splash" class="splash">
    <div class="splash-logo-wrap">
      <div class="splash-glow"></div>
      <div class="splash-logo">▶</div>
    </div>
    <div class="splash-brand">Cine<span>CLT</span></div>
    <div class="splash-tag">Filmes Free</div>
    <div class="splash-ver" style="margin-top:26px;font-size:20px;font-weight:800;color:#ffd54a;letter-spacing:2px;opacity:0;animation:fadeUp .6s .6s ease forwards;">v2.88</div>
    <div class="splash-bar"><i></i></div>
  </div>
  <!-- PROFILES -->
  <div id="screenProfiles" class="screen active">
    <div class="wrap">
      <div class="head-sub">
        <div class="brand-row"><div class="logo-box">▶</div><div class="brand-text">Cine<span>CLT</span></div></div>
        Quem está assistindo?
      </div>
      <div class="profile-grid" id="profileGrid"></div>
      <div class="manage-bar">
        <button class="btn ghost focusable" id="btnAddProfile" tabindex="0">＋ Adicionar perfil</button>
        <button class="btn ghost focusable" id="btnEditMode" tabindex="0">Gerenciar perfis</button>
      </div>
    </div>
  </div>

  <!-- HOME -->
  <div id="screenHome" class="screen">
    <div class="nav">
      <div class="nav-left">
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="logo-box" style="width:44px;height:44px;font-size:24px;border-radius:11px;">▶</div>
          <div class="brand-text" style="font-size:26px;">Cine<span>CLT</span></div>
        </div>
        <div class="nav-links" id="navLinks">
          <span class="nav-link active focusable" data-cat="home" tabindex="0">INÍCIO</span>
          <span class="nav-link focusable" data-cat="filmes" tabindex="0">FILMES</span>
          <span class="nav-link focusable" data-cat="series" tabindex="0">SÉRIES</span>
          <span class="nav-link focusable" data-cat="minha" tabindex="0">MINHA LISTA</span>
          <span class="nav-link focusable" data-cat="favoritos" tabindex="0">FAVORITOS</span>
        </div>
      </div>
      <div class="nav-profile focusable" id="navProfile" tabindex="0">
        <span id="navProfileName" style="font-size:32px;font-weight:800;">Perfil</span>
        <div class="avatar" id="navProfileAvatar"></div>
      </div>
    </div>
    <div class="hero" id="hero"></div>
    <div class="content-rows" id="rows"></div>
    <div id="versionTag">v2.88</div>
  </div>

  <!-- PROFILE MODAL -->
  <div class="modal-layer" id="modalProfile">
    <div class="modal">
      <h2 id="modalProfileTitle">Novo perfil</h2>
      <div class="desc">Escolha um nome e uma das imagens de perfil.</div>
      <div class="field"><label>Nome do perfil</label>
        <input class="name-input focusable" id="profileNameInput" type="text" maxlength="20" placeholder="Digite o nome"></div>
      <div class="field"><label>Ícone</label><div class="icon-picker" id="profileIconPicker"></div></div>
      <div class="modal-actions">
        <button class="btn danger focusable" id="btnModalDelete" tabindex="0" style="display:none;">Apagar</button>
        <div class="spacer"></div>
        <button class="btn ghost focusable" id="btnModalCancel" tabindex="0">Cancelar</button>
        <button class="btn primary focusable" id="btnModalSave" tabindex="0">Salvar</button>
      </div>
    </div>
  </div>

  <!-- CONFIRM DELETE -->
  <div class="modal-layer" id="modalConfirm">
    <div class="modal" style="width:500px;">
      <h2>Apagar perfil?</h2>
      <div class="desc" id="modalConfirmText">Esta ação não pode ser desfeita.</div>
      <div class="modal-actions">
        <button class="btn ghost focusable" id="btnConfirmCancel" tabindex="0">Cancelar</button>
        <button class="btn danger focusable" id="btnConfirmYes" tabindex="0">Apagar</button>
      </div>
    </div>
  </div>

  <!-- DETAIL -->
  <div class="modal-layer" id="modalDetail">
    <div class="modal" style="width:860px;">
      <div class="detail-flex">
        <div class="detail-media"><img id="detailPoster" alt=""></div>
        <div class="detail-info">
          <h2 class="detail-title" id="detailTitle"></h2>
          <div class="detail-meta" id="detailMeta"></div>
          <div class="detail-desc" id="detailDesc"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn ghost focusable" id="btnDetailFav" tabindex="0">★ Favorito</button>
        <div class="spacer"></div>
        <button class="btn ghost focusable" id="btnDetailClose" tabindex="0">Fechar</button>
        <button class="btn primary focusable" id="btnDetailPlay" tabindex="0">▶ Assistir</button>
      </div>
    </div>
  </div>

  <!-- PLAYER -->
  <div class="modal-layer" id="playerLayer" style="background:#000;">
    <div class="player-box">
      <div class="player-frame" id="playerFrame"></div>
      <div class="player-row">
        <button class="btn ghost focusable" id="btnPlayerExt" tabindex="0">Abrir no YouTube</button>
        <button class="btn ghost focusable" id="btnPlayerClose" tabindex="0">✕ Fechar player</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

/* ============ Keyboard / D-pad navigation ============ */
function getFocusables(screen){
  return Array.prototype.slice.call(screen.querySelectorAll('.focusable')).filter(function(e){
    var r=e.getBoundingClientRect();return r.width>0&&r.height>0;
  });
}
/* cache de posições do foco (evita getBoundingClientRect em toda tecla) */
var _fc={t:0,box:null,items:[],rc:[]};
function _fcInvalidate(){_fc.t=0;_fc.box=null;}
function _fcSync(box){
  var now=Date.now();
  if(_fc.box===box&&now-_fc.t<3000)return;
  _fc.box=box;_fc.t=now;
  _fc.items=getFocusables(box);
  _fc.rc=_fc.items.map(function(e){var r=e.getBoundingClientRect();return {l:r.left,t:r.top,w:r.width,h:r.height};});
}
document.addEventListener('scroll',_fcInvalidate,{capture:true,passive:true});
function moveFocus(dir){
  var scr=document.querySelector('.screen.active');
  var modal=document.querySelector('.modal-layer.active');
  var box=modal||scr;
  _fcSync(box);
  var items=_fc.items;if(!items.length)return;
  var idx=items.indexOf(document.activeElement);if(idx<0)idx=0;
  var c=_fc.rc[idx];if(!c)return;
  var cx=c.l+c.w/2,cy=c.t+c.h/2;
  var best=null,bd=Infinity,i,cc,x,y,dx,dy,ok,dist;
  for(i=0;i<items.length;i++){
    if(i===idx)continue;
    cc=_fc.rc[i];x=cc.l+cc.w/2;y=cc.t+cc.h/2;dx=x-cx;dy=y-cy;
    ok=false;
    if(dir==='left')ok=dx<-5&&Math.abs(dy)<90;
    else if(dir==='right')ok=dx>5&&Math.abs(dy)<90;
    else if(dir==='up')ok=dy<-5&&Math.abs(dx)<250;
    else if(dir==='down')ok=dy>5&&Math.abs(dx)<250;
    if(!ok)continue;
    dist=Math.hypot(dx,dy);if(dist<bd){bd=dist;best=items[i];}
  }
  if(best)best.focus();
}
function selectIcon(icon){
  selIcon=icon;
  document.querySelectorAll('#profileIconPicker .icon-opt').forEach(function(x){x.classList.remove('selected');});
  document.querySelectorAll('#profileIconPicker .icon-opt').forEach(function(x){if(x.getAttribute('data-icon')===icon)x.classList.add('selected');});
}
function activate(elm,box){
  if(!elm)return;
  if(elm.classList&&elm.classList.contains('icon-opt')){selectIcon(elm.getAttribute('data-icon'));return;}
  if(box.id==='screenProfiles'){
    if(elm.hasAttribute('data-add')){openProfileModal(null);return;}
    if(elm.hasAttribute('data-idx')){var i=+elm.getAttribute('data-idx');if(editing)openProfileModal(i);else enterProfile(i);return;}
  }
  if(box.id==='screenHome'){
    if(elm.classList.contains('nav-link')){setNav(elm.getAttribute('data-cat'));return;}
    if(elm.id==='navProfile'){showScreen('Profiles');return;}
    if(elm.classList.contains('card')){openDetail(+elm.getAttribute('data-id'));return;}
    if(elm.hasAttribute('data-play')){openDetail(+elm.getAttribute('data-play'));return;}
    if(elm.hasAttribute('data-mylist')){toggleMyList(+elm.getAttribute('data-mylist'));return;}
    if(elm.hasAttribute('data-fav')){toggleFav(+elm.getAttribute('data-fav'));return;}
  }
  if(elm.id==='btnAddProfile')openProfileModal(null);
  else if(elm.id==='btnEditMode')toggleEdit();
  else if(elm.id==='btnModalCancel'){S('modalProfile').classList.remove('active');editingIdx=null;_fcInvalidate();}
  else if(elm.id==='btnModalSave')saveProfileForm();
  else if(elm.id==='btnModalDelete')confirmDelete();
  else if(elm.id==='btnConfirmCancel')S('modalConfirm').classList.remove('active');
  else if(elm.id==='btnConfirmYes')doDelete();
  else if(elm.id==='btnDetailClose'){S('modalDetail').classList.remove('active');_fcInvalidate();}
  else if(elm.id==='btnDetailFav')toggleFav(detailId);
  else if(elm.id==='btnDetailPlay')playVideo(detailId);
  else if(elm.id==='btnPlayerClose')closePlayer();
}

document.addEventListener('keydown',function(e){
  var scr=document.querySelector('.screen.active');
  var modal=document.querySelector('.modal-layer.active');
  var box=modal||scr;
  if(e.key==='Escape'){
    if(S('playerLayer').classList.contains('active')){closePlayer();return;}
    if(modal){modal.classList.remove('active');_fcInvalidate();}
    else if(scr.id==='screenHome')showScreen('Profiles');
    return;
  }
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown'){
    e.preventDefault();moveFocus(e.key.replace('Arrow','').toLowerCase());return;
  }
  if(e.key==='Enter'){e.preventDefault();activate(document.activeElement,box);return;}
  if(e.key==='Backspace'&&!modal&&scr.id==='screenHome'){showScreen('Profiles');return;}
});

/* ---- Efeito sonoro do splash (sintetizado via Web Audio) ---- */
var sndPlayed=false;
function playSplashSound(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(!window.__sndctx)window.__sndctx=new AC();
    if(window.__sndctx.state==='suspended')window.__sndctx.resume();
    var ctx=window.__sndctx;
    // tom quente e suave (seno + leve harmônico) para um 'ta-dum' agradável
    function tone(freq,at,dur,vol){
      var t=ctx.currentTime+at;
      var o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(freq,t);
      var o2=ctx.createOscillator();o2.type='triangle';o2.frequency.setValueAtTime(freq*2,t);
      var g=ctx.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol,t+0.025);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      var g2=ctx.createGain();g2.gain.value=0.22;
      o.connect(g);o2.connect(g2);g2.connect(g);g.connect(ctx.destination);
      o.start(t);o2.start(t);o.stop(t+dur+0.03);o2.stop(t+dur+0.03);
    }
    // 'ta-dum' macio: nota quente + nota mais grave e ressonante
    tone(196.0,0.12,0.50,0.28);   // 'ta' (A3)
    tone(130.8,0.48,0.95,0.34);   // 'dum' (C3, mais grave)
  }catch(e){}
}
function trySplashSound(){
  if(sndPlayed)return;
  playSplashSound();sndPlayed=true;
}
// desbloqueia o áudio (autoplay) no primeiro toque, sem tocar antes do pico
document.addEventListener('keydown',function(){
  try{if(window.__sndctx&&window.__sndctx.state==='suspended')window.__sndctx.resume();}catch(e){}
},{once:true});
// toca o som no pico do logo (~1.15s) e depois some
setTimeout(function(){trySplashSound();},1000);

/* ============ AUTO-ATUALIZAÇÃO ============ */
function checkUpdate(){
  if(!REMOTE_BASE)return;
  var base=REMOTE_BASE.replace(/\/+$/,'');
  var x=new XMLHttpRequest();
  x.open('GET',base+'/version.json?t='+Date.now(),true);
  x.timeout=7000;
  x.onload=function(){
    try{
      var v=JSON.parse(x.responseText);
      if(v.version&&String(v.version)!==APP_VERSION){
        var isRemote=(location.protocol==='http:'||location.protocol==='https:');
        if(isRemote){
          toast('Atualização v'+v.version+' disponível!');
          setTimeout(function(){location.reload();},2800);
        }else{
          /* modo APK/local: navega sozinho para a versão online mais nova */
          toast('Atualizando para v'+v.version+'...');
          setTimeout(function(){location.href=base+'/index.html';},1600);
        }
      }else{
        console.log('[CineCLT] Versão atual já é a mais recente (v'+APP_VERSION+').');
      }
    }catch(e){console.log('[CineCLT] version.json inválido',e);}
  };
  x.onerror=function(){console.log('[CineCLT] Sem conexão com a base remota.');};
  x.send();
}
/* verificação: no início e de hora em hora */
setTimeout(checkUpdate,2400);
setInterval(checkUpdate,3600000);
</script>
</body>
</html>
